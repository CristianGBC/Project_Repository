x-storage-common: &storage-common
  profiles:
    - storage
  build:
    context: ../..
    dockerfile: infrastructure/docker/Dockerfile.storage
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

x-storage-environment: &storage-environment
  DATA_ROOT: /data
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
  REPAIR_INTERNAL_TOKEN: ${REPAIR_INTERNAL_TOKEN:-!development-repair-token!}
  STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:-!development-storage-token!}

services:
  upload-reconciler:
    profiles:
      - reconciliation
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.coordinator
    command:
      - python
      - -m
      - backend.reconciliation.main
    restart: unless-stopped
    environment:
      NODE_BIO_URL: ${NODE_BIO_URL:-http://node-bio:8000}
      NODE_PHY_URL: ${NODE_PHY_URL:-http://node-phy:8000}
      NODE_MATH_URL: ${NODE_MATH_URL:-http://node-math:8000}
      NODE_CHEM_URL: ${NODE_CHEM_URL:-http://node-chem:8000}
      NODE_EARTH_URL: ${NODE_EARTH_URL:-http://node-earth:8000}
      NODE_AGRO_URL: ${NODE_AGRO_URL:-http://node-agro:8000}
      DATABASE_URL: ${DATABASE_URL:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      RECONCILIATION_ENABLED: ${RECONCILIATION_ENABLED:-true}
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-15}
      RECONCILIATION_RETRY_BACKOFF_SECONDS: ${RECONCILIATION_RETRY_BACKOFF_SECONDS:-30}
      RECONCILIATION_MAX_ATTEMPTS: ${RECONCILIATION_MAX_ATTEMPTS:-10}
      RECONCILIATION_MAX_CONCURRENT_JOBS: ${RECONCILIATION_MAX_CONCURRENT_JOBS:-2}
      RECONCILIATION_TRANSFER_TIMEOUT_SECONDS: ${RECONCILIATION_TRANSFER_TIMEOUT_SECONDS:-120}
      REPAIR_INTERNAL_TOKEN: ${REPAIR_INTERNAL_TOKEN:-!development-repair-token!}
      STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:-!development-storage-token!}

  replica-repair:
    profiles:
      - repair
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.coordinator
    command:
      - python
      - -m
      - backend.repair.main
    restart: unless-stopped
    environment:
      NODE_BIO_URL: ${NODE_BIO_URL:-http://node-bio:8000}
      NODE_PHY_URL: ${NODE_PHY_URL:-http://node-phy:8000}
      NODE_MATH_URL: ${NODE_MATH_URL:-http://node-math:8000}
      NODE_CHEM_URL: ${NODE_CHEM_URL:-http://node-chem:8000}
      NODE_EARTH_URL: ${NODE_EARTH_URL:-http://node-earth:8000}
      NODE_AGRO_URL: ${NODE_AGRO_URL:-http://node-agro:8000}
      DATABASE_URL: ${DATABASE_URL:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      REPAIR_ENABLED: ${REPAIR_ENABLED:-true}
      REPAIR_INTERVAL_SECONDS: ${REPAIR_INTERVAL_SECONDS:-10}
      REPAIR_DOWN_GRACE_SECONDS: ${REPAIR_DOWN_GRACE_SECONDS:-60}
      REPAIR_MAX_CONCURRENT_JOBS: ${REPAIR_MAX_CONCURRENT_JOBS:-2}
      REPAIR_TRANSFER_TIMEOUT_SECONDS: ${REPAIR_TRANSFER_TIMEOUT_SECONDS:-120}
      REPAIR_RETRY_BACKOFF_SECONDS: ${REPAIR_RETRY_BACKOFF_SECONDS:-30}
      REPAIR_EXCESS_CLEANUP_ENABLED: ${REPAIR_EXCESS_CLEANUP_ENABLED:-true}
      REPAIR_INTERNAL_TOKEN: ${REPAIR_INTERNAL_TOKEN:-!development-repair-token!}
      STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:-!development-storage-token!}

  health-monitor:
    profiles:
      - monitor
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.coordinator
    command:
      - python
      - -m
      - backend.monitor.main
    restart: unless-stopped
    environment:
      NODE_BIO_URL: ${NODE_BIO_URL:-http://node-bio:8000}
      NODE_PHY_URL: ${NODE_PHY_URL:-http://node-phy:8000}
      NODE_MATH_URL: ${NODE_MATH_URL:-http://node-math:8000}
      NODE_CHEM_URL: ${NODE_CHEM_URL:-http://node-chem:8000}
      NODE_EARTH_URL: ${NODE_EARTH_URL:-http://node-earth:8000}
      NODE_AGRO_URL: ${NODE_AGRO_URL:-http://node-agro:8000}
      DATABASE_URL: ${DATABASE_URL:-}
      HEALTH_CHECK_INTERVAL_SECONDS: ${HEALTH_CHECK_INTERVAL_SECONDS:-5}
      HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-2}
      HEALTH_FAILURE_THRESHOLD: ${HEALTH_FAILURE_THRESHOLD:-3}
      HEALTH_RECOVERY_THRESHOLD: ${HEALTH_RECOVERY_THRESHOLD:-2}

  coordinator:
    profiles:
      - coordinator
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.coordinator
    restart: unless-stopped
    environment:
      NODE_BIO_URL: ${NODE_BIO_URL:-http://node-bio:8000}
      NODE_PHY_URL: ${NODE_PHY_URL:-http://node-phy:8000}
      NODE_MATH_URL: ${NODE_MATH_URL:-http://node-math:8000}
      NODE_CHEM_URL: ${NODE_CHEM_URL:-http://node-chem:8000}
      NODE_EARTH_URL: ${NODE_EARTH_URL:-http://node-earth:8000}
      NODE_AGRO_URL: ${NODE_AGRO_URL:-http://node-agro:8000}
      NODE_REQUEST_TIMEOUT_SECONDS: ${NODE_REQUEST_TIMEOUT_SECONDS:-2.0}
      DOCUMENT_TRANSFER_TIMEOUT_SECONDS: ${DOCUMENT_TRANSFER_TIMEOUT_SECONDS:-30.0}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      REPLICATION_FACTOR: ${REPLICATION_FACTOR:-3}
      DATABASE_URL: ${DATABASE_URL:-}
      TECHNICAL_USER_ID: ${TECHNICAL_USER_ID:-7d14ef5d-3c61-4ac8-90b5-2bd3f0aa0431}
      TECHNICAL_USER_EMAIL: ${TECHNICAL_USER_EMAIL:-development-operations@yachayrepo.invalid}
      TECHNICAL_USER_PASSWORD_HASH: ${TECHNICAL_USER_PASSWORD_HASH:-!authentication-disabled!}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-jwt-secret-change-me-0123456789abcdef}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-yachayrepo}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-yachayrepo-api}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-300}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:-!development-storage-token!}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  node-bio:
    <<: *storage-common
    environment:
      <<: *storage-environment
      NODE_ID: node-bio
      SCHOOL_NAME: Escuela de Ciencias Biológicas e Ingeniería
    volumes:
      - storage_bio:/data
    ports:
      - "8001:8000"

  node-phy:
    <<: *storage-common
    environment:
      <<: *storage-environment
      NODE_ID: node-phy
      SCHOOL_NAME: Escuela de Ciencias Físicas y Nanotecnología
    volumes:
      - storage_phy:/data
    ports:
      - "8002:8000"

  node-math:
    <<: *storage-common
    environment:
      <<: *storage-environment
      NODE_ID: node-math
      SCHOOL_NAME: Escuela de Ciencias Matemáticas y Computacionales
    volumes:
      - storage_math:/data
    ports:
      - "8003:8000"

  node-chem:
    <<: *storage-common
    environment:
      <<: *storage-environment
      NODE_ID: node-chem
      SCHOOL_NAME: Escuela de Ciencias Químicas e Ingeniería
    volumes:
      - storage_chem:/data
    ports:
      - "8004:8000"

  node-earth:
    <<: *storage-common
    environment:
      <<: *storage-environment
      NODE_ID: node-earth
      SCHOOL_NAME: Escuela de Ciencias de la Tierra, Energía y Ambiente
    volumes:
      - storage_earth:/data
    ports:
      - "8005:8000"

  node-agro:
    <<: *storage-common
    environment:
      <<: *storage-environment
      NODE_ID: node-agro
      SCHOOL_NAME: Escuela de Ciencias Agropecuarias y Agroindustriales
    volumes:
      - storage_agro:/data
    ports:
      - "8006:8000"

volumes:
  storage_bio:
  storage_phy:
  storage_math:
  storage_chem:
  storage_earth:
  storage_agro:
