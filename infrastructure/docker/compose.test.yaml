name: yachayrepo-test

services:
  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-yachayrepo_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-yachayrepo_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-yachayrepo_test}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

volumes:
  postgres_test_data:
