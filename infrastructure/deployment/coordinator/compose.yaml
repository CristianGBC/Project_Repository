name: yachayrepo-physical-coordinator
x-runtime: &runtime
  build:
    context: ../../..
    dockerfile: infrastructure/docker/Dockerfile.coordinator
  image: yachayrepo-physical-backend:${DEPLOY_TAG:-local}
  env_file: .env
  environment:
    DATABASE_URL: ${DATABASE_URL:?required}
    AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?required}
    STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:?required}
    REPAIR_INTERNAL_TOKEN: ${REPAIR_INTERNAL_TOKEN:?required}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?required}
  entrypoint: ["python", "-m", "backend.app.physical_catalog", "run"]
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "5m"
      max-file: "3"
services:
  coordinator:
    <<: *runtime
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${BIND_IP:?required}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
  health-monitor:
    <<: *runtime
    command: ["python", "-m", "backend.monitor.main"]
  replica-repair:
    <<: *runtime
    command: ["python", "-m", "backend.repair.main"]
  upload-reconciler:
    <<: *runtime
    command: ["python", "-m", "backend.reconciliation.main"]
  frontend:
    build:
      context: ../../..
      dockerfile: infrastructure/deployment/coordinator/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?required}
    ports:
      - "${BIND_IP:?required}:5173:80"
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
