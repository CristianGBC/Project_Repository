name: yachayrepo-physical-agro
x-node: &node
  build:
    context: ../../..
    dockerfile: infrastructure/docker/Dockerfile.storage
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "5m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 15s
    timeout: 3s
    retries: 3
x-env: &storage
  DATA_ROOT: /data
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
  STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:?required}
  REPAIR_INTERNAL_TOKEN: ${REPAIR_INTERNAL_TOKEN:?required}
services:
  node-agro:
    <<: *node
    environment:
      <<: *storage
      NODE_ID: node-agro
      SCHOOL_NAME: undefined
    ports:
      - "${BIND_IP:?required}:${AGRO_PORT:-8106}:8000"
    volumes:
      - agro:/data
volumes:
  agro: {}
